services:
  crafty-accounting:
    build: .
    image: crafty-accounting:latest
    container_name: crafty-accounting
    restart: unless-stopped
    # Optional: everything has a default (see "Configuration" in the README).
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      BACKUP_DIR: /backups
      PORT: 3000
      TZ: ${TZ:-Europe/London}
      # Always served over HTTPS through Caddy below.
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      # Settings -> Updates shows the command to run instead of updating itself.
      CRAFTY_INSTALL: docker
      # Settings -> HTTPS Certificate writes an uploaded certificate here, for Caddy.
      CRAFTY_TLS_DIR: /tls
    # Not published on the host: only Caddy talks to the app.
    expose:
      - "3000"
    volumes:
      - crafty-data:/data
      # Automatic backups go to a folder on the host, ideally another disk or a NAS share.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - crafty-tls:/tls

  caddy:
    # Caddy with the Cloudflare DNS module, for a domain on Cloudflare (Settings -> HTTPS Certificate).
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: crafty-caddy:latest
    container_name: crafty-caddy
    restart: unless-stopped
    depends_on:
      - crafty-accounting
    # Each with a default: Caddy reads a variable that's set but empty as empty.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      SITE_IP: ${SITE_IP:-localhost}
      TLS_CUSTOM: ${TLS_CUSTOM:-}
    # A certificate uploaded in Settings -> HTTPS Certificate is used for SITE_ADDRESS, unless
    # TLS_CUSTOM=off, and a domain set up there is imported from /tls (see the Caddyfile). Both
    # are read on starting: docker compose restart caddy after a change.
    command:
      - sh
      - -c
      - |
        # A domain set up there has its own site block, and Caddy refuses a name in two.
        domain="$$(sed -n '/^[^#[:space:]].* {$$/{s/ {$$//;s/:[0-9]*$$//;p;q;}' /tls/domain.caddy 2>/dev/null | tr A-Z a-z)"
        if [ -n "$$domain" ]; then
          SITE_ADDRESS="$$(printf '%s' "$$SITE_ADDRESS" | tr ',' '\n' | awk -v d="$$domain" 'NF { a = $$1; h = tolower(a); sub(/^[a-z]+:\/\//, "", h); sub(/:[0-9]+$$/, "", h); if (h != d) out = out (out ? ", " : "") a } END { print out }')"
          export SITE_ADDRESS="$${SITE_ADDRESS:-localhost}"
        fi
        if [ "$$(echo "$$TLS_CUSTOM" | tr A-Z a-z)" != off ] && [ -s /tls/cert.pem ] && [ -s /tls/key.pem ]; then
          export CRAFTY_SITE_TLS="/tls/cert.pem /tls/key.pem" CRAFTY_CA_HIDDEN=-not-in-use
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates (including the private certificate authority) live here.
      - caddy-data:/data
      - caddy-config:/config
      - crafty-tls:/tls:ro

volumes:
  crafty-data:
  crafty-tls:
  caddy-data:
  caddy-config:
